<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Workout Tracker</title>
<style>
  :root {
    --bg: #0e1116;
    --card: #171c24;
    --card-2: #1f2630;
    --line: #2a3340;
    --text: #e8edf3;
    --muted: #8b98a9;
    --accent: #38d39f;
    --accent-2: #2bb583;
    --danger: #ef5b5b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #16202b 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 22px; }
  header h1 {
    font-size: 1.7rem;
    letter-spacing: .5px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  header h1 .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 14px var(--accent);
  }
  header p { color: var(--muted); font-size: .9rem; margin-top: 6px; }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    text-align: center;
  }
  .stat .num { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
  .stat .lbl { font-size: .75rem; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: .5px; }

  form {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    display: grid;
    grid-template-columns: 1.4fr 1fr .8fr .8fr auto;
    gap: 12px;
    align-items: end;
    margin-bottom: 26px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: .75rem; color: var(--muted); letter-spacing: .3px; }
  input, select {
    background: var(--card-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: .95rem;
    width: 100%;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(56, 211, 159, .15);
  }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(.7); cursor: pointer; }
  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    font-size: .95rem;
    font-weight: 600;
    transition: transform .1s, filter .15s;
  }
  button:active { transform: scale(.97); }
  .btn-add {
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
    color: #06231a;
    padding: 11px 20px;
    white-space: nowrap;
  }
  .btn-add:hover { filter: brightness(1.08); }

  .day { margin-bottom: 22px; }
  .day-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    padding: 0 4px;
  }
  .day-head h2 { font-size: 1rem; font-weight: 600; }
  .day-head .badge {
    font-size: .72rem;
    color: var(--muted);
    background: var(--card);
    border: 1px solid var(--line);
    padding: 3px 10px;
    border-radius: 20px;
  }
  .entry {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 8px;
    animation: pop .18s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .entry .name { flex: 1; font-weight: 600; }
  .entry .meta { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    font-size: .78rem;
    background: var(--card-2);
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .chip b { color: var(--text); font-weight: 600; }
  .btn-del {
    background: transparent;
    color: var(--muted);
    font-size: 1.1rem;
    padding: 4px 8px;
    border-radius: 8px;
  }
  .btn-del:hover { color: var(--danger); background: rgba(239, 91, 91, .1); }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
    border: 1px dashed var(--line);
    border-radius: 16px;
    font-size: .9rem;
  }

  @media (max-width: 640px) {
    form { grid-template-columns: 1fr 1fr; }
    .field.full { grid-column: 1 / -1; }
    .btn-add { grid-column: 1 / -1; padding: 12px; }
    .entry { flex-wrap: wrap; }
    .entry .name { flex-basis: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="dot"></span> Gym Workout Tracker</h1>
    <p>ඔබේ workout දවස්, sets සහ reps මෙතන note කරගන්න</p>
  </header>

  <div class="stats">
    <div class="stat"><div class="num" id="statDays">0</div><div class="lbl">Workout Days</div></div>
    <div class="stat"><div class="num" id="statSets">0</div><div class="lbl">Total Sets</div></div>
    <div class="stat"><div class="num" id="statReps">0</div><div class="lbl">Total Reps</div></div>
  </div>

  <form id="workoutForm">
    <div class="field full">
      <label for="exercise">Exercise</label>
      <input id="exercise" type="text" placeholder="උදා: Bench Press" required>
    </div>
    <div class="field">
      <label for="date">Date</label>
      <input id="date" type="date" required>
    </div>
    <div class="field">
      <label for="sets">Sets</label>
      <input id="sets" type="number" min="1" step="1" value="3" required>
    </div>
    <div class="field">
      <label for="reps">Reps</label>
      <input id="reps" type="number" min="1" step="1" value="10" required>
    </div>
    <button class="btn-add" type="submit">+ Add</button>
  </form>

  <div id="list"></div>
</div>

<script>
  const KEY = "gymWorkouts";
  const form = document.getElementById("workoutForm");
  const list = document.getElementById("list");
  const dateInput = document.getElementById("date");

  const today = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  dateInput.value = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;

  let workouts = load();

  function load() {
    try {
      return JSON.parse(localStorage.getItem(KEY)) || [];
    } catch (e) {
      return [];
    }
  }

  function save() {
    localStorage.setItem(KEY, JSON.stringify(workouts));
  }

  function formatDate(iso) {
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  }

  function render() {
    const totalSets = workouts.reduce((s, w) => s + w.sets, 0);
    const totalReps = workouts.reduce((s, w) => s + w.sets * w.reps, 0);
    const days = new Set(workouts.map((w) => w.date)).size;
    document.getElementById("statDays").textContent = days;
    document.getElementById("statSets").textContent = totalSets;
    document.getElementById("statReps").textContent = totalReps;

    if (!workouts.length) {
      list.innerHTML = '<div class="empty">තවම workout එකක් නැහැ. උඩින් add කරන්න 💪</div>';
      return;
    }

    const grouped = {};
    workouts.forEach((w) => {
      (grouped[w.date] = grouped[w.date] || []).push(w);
    });

    const dates = Object.keys(grouped).sort((a, b) => b.localeCompare(a));

    list.innerHTML = dates.map((date) => {
      const items = grouped[date];
      const entries = items.map((w) => `
        <div class="entry">
          <span class="name">${escapeHtml(w.exercise)}</span>
          <div class="meta">
            <span class="chip"><b>${w.sets}</b> sets</span>
            <span class="chip"><b>${w.reps}</b> reps</span>
          </div>
          <button class="btn-del" data-id="${w.id}" title="Delete">✕</button>
        </div>`).join("");
      return `
        <div class="day">
          <div class="day-head">
            <h2>${formatDate(date)}</h2>
            <span class="badge">${items.length} exercise${items.length > 1 ? "s" : ""}</span>
          </div>
          ${entries}
        </div>`;
    }).join("");
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const exercise = document.getElementById("exercise").value.trim();
    const date = dateInput.value;
    const sets = parseInt(document.getElementById("sets").value, 10);
    const reps = parseInt(document.getElementById("reps").value, 10);
    if (!exercise || !date || !sets || !reps) return;

    workouts.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), exercise, date, sets, reps });
    save();
    render();
    form.reset();
    dateInput.value = date;
    document.getElementById("sets").value = 3;
    document.getElementById("reps").value = 10;
    document.getElementById("exercise").focus();
  });

  list.addEventListener("click", (e) => {
    const btn = e.target.closest(".btn-del");
    if (!btn) return;
    workouts = workouts.filter((w) => w.id !== btn.dataset.id);
    save();
    render();
  });

  render();
</script>
</body>
</html>
